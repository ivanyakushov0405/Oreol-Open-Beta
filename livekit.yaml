# Local LiveKit for development (container oreol-glass-mvp-livekit-1).
# Keys come from LIVEKIT_KEYS (compose), the IP from --node-ip. Production config: deploy/livekit.yaml.
port: 7880              # signalling WebSocket/API
rtc:
  tcp_port: 7881        # media over TCP
  udp_port: 7882        # media over UDP
  use_external_ip: false
audio:
  active_level: 52
  min_percentile: 20
  update_interval: 200
  smooth_intervals: 2
logging:
  level: info
