# /etc/nginx/sites-available/new.halomvp.ru  (+ symlink in sites-enabled)
# Separate site: the old halomvp.ru configs are untouched.
limit_req_zone $binary_remote_addr zone=oreol_limit:10m rate=10r/s;

map $http_upgrade $oreol_new_connection {  # own name to avoid clashing with the old config
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name new.halomvp.ru;
    location ^~ /.well-known/acme-challenge/ { 
        root /var/www/certbot; 
    }
    if ($host = new.halomvp.ru) {
        return 301 https://$host$request_uri;
    } 
    return 404;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name new.halomvp.ru;

    ssl_certificate     /etc/letsencrypt/live/new.halomvp.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/new.halomvp.ru/privkey.pem;
    # SSl Security and Optimization
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    gzip on;
    gzip_types application/json application/javascript text/plain text/css image/svg+xml;

    client_max_body_size 55m;

    location / {
        limit_req zone=oreol_limit burst=15 nodelay;
        proxy_pass http://127.0.0.1:8100;
        include /etc/nginx/snippets/oreol-new-proxy.conf;
    }
    location /rtc {
        proxy_pass http://127.0.0.1:7890;
        include /etc/nginx/snippets/oreol-new-proxy.conf;
    }
}
