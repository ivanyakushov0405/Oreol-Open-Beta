# /etc/nginx/sites-available/new.halomvp.ru  (+ симлинк в sites-enabled)
# Отдельный сайт: старые конфиги halomvp.ru не трогаются.

map $http_upgrade $oreol_new_connection {  # своё имя, чтобы не конфликтовать со старым конфигом
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name new.halomvp.ru;
    # certbot --nginx сам добавит сюда редирект на https и блок 443
    # Фото в чате — до 10 МБ, фон профиля — до 6 МБ (по умолчанию nginx пускает только 1 МБ)
    client_max_body_size 12m;
    location / {
        proxy_pass http://127.0.0.1:8100;
        include /etc/nginx/snippets/oreol-new-proxy.conf;
    }
    location /rtc {
        proxy_pass http://127.0.0.1:7890;
        include /etc/nginx/snippets/oreol-new-proxy.conf;
    }
}
