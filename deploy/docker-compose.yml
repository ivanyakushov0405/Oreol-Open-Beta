# New Oreol version next to the old one: new.halomvp.ru
# Everything listens on 127.0.0.1 (except LiveKit media ports); the system nginx faces the internet.
# Ports intentionally differ from the defaults (8000 / 7880-7882) so the old stack is untouched.
# Unique project and container names: the old stack (oreol-glass-mvp-*) is untouched
name: oreol-new

services:
  app:
    container_name: oreol-new-app
    image: oreol-new-app:latest
    build:
      context: ..
      dockerfile: Dockerfile
    network_mode: host
    restart: unless-stopped
    env_file: .env
    environment:
      APP_PORT: "8100"
      DB_NAME: /data/chat.db
      # The browser reaches LiveKit through nginx on the same domain (location /rtc)
      LK_SERVER_URL: wss://new.halomvp.ru
      # The backend talks to LiveKit directly
      LK_API_URL: http://127.0.0.1:7890
      VOICE_ROOM_NAME: oreol-new-lobby
    volumes:
      - ./data:/data

  livekit:
    container_name: oreol-new-livekit
    image: livekit/livekit-server:v1.13.11
    network_mode: host
    restart: unless-stopped
    command: --config /etc/livekit.yaml --node-ip ${PUBLIC_IP}
    environment:
      LIVEKIT_KEYS: "${LK_API_KEY}: ${LK_API_SECRET}"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
