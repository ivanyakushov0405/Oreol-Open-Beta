map $http_upgrade $oreol_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 443 ssl;
    server_name chat.example.com;

    ssl_certificate /etc/letsencrypt/live/oreol-demo/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/oreol-demo/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    auth_basic "Oreol demo";
    auth_basic_user_file /etc/nginx/oreol.htpasswd;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $oreol_connection_upgrade;
    proxy_set_header Authorization "";
    proxy_read_timeout 3600s;

    location /ws/ {
        if ($http_origin != "https://chat.example.com") {
            return 403;
        }

        proxy_pass http://127.0.0.1:8000;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
    }
}

server {
    listen 443 ssl;
    server_name rtc.example.com;

    ssl_certificate /etc/letsencrypt/live/oreol-demo/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/oreol-demo/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # При подключении SDK может передать JWT в строке запроса.
    access_log off;

    location / {
        proxy_pass http://127.0.0.1:7880;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $oreol_connection_upgrade;
        proxy_read_timeout 3600s;
    }
}
