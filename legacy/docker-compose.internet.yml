services:
  app:
    build: .
    network_mode: host
    restart: unless-stopped
    command: ["uvicorn", "main:app", "--host", "127.0.0.1", "--port", "8000"]
    environment:
      LK_SERVER_URL: "${LK_SERVER_URL:?Set the public wss address in .env}"
      LK_API_URL: "${LK_API_URL:-http://127.0.0.1:7880}"
      LK_API_KEY: "${LK_API_KEY:?Set LK_API_KEY in .env}"
      LK_API_SECRET: "${LK_API_SECRET:?Set LK_API_SECRET in .env}"
      DB_NAME: "/data/chat.db"
    volumes:
      - chat-data:/data
    depends_on:
      - livekit

  livekit:
    image: livekit/livekit-server:v1.13.11
    network_mode: host
    restart: unless-stopped
    command:
      - "--config"
      - "/etc/livekit.yaml"
      - "--node-ip"
      - "${LIVEKIT_NODE_IP:?Set the public IPv4 address in .env}"
    environment:
      LIVEKIT_KEYS: "${LK_API_KEY:?Set LK_API_KEY in .env}: ${LK_API_SECRET:?Set LK_API_SECRET in .env}"
    volumes:
      - ./deploy/livekit.yaml:/etc/livekit.yaml:ro

volumes:
  chat-data:
