<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Oreol: Page not found</title>
    <link rel="icon" href="/favicon.ico" />
    <style>
      :root { color-scheme: dark; }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box;
        font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; color: #e8f1fb;
        background: radial-gradient(1200px 600px at 70% 20%, #1e6bff33, transparent 60%),
          radial-gradient(900px 500px at 10% 90%, #7a5cff2e, transparent 60%), #050b16;
      }
      @media (prefers-color-scheme: light) {
        :root { color-scheme: light; }
        body { color: #0b1a2c; background: radial-gradient(1200px 600px at 70% 20%, #1e6bff1f, transparent 60%), #eef3f9; }
        .card { background: #ffffffb3 !important; border-color: #1a335024 !important; }
        p { color: #4a5d73 !important; }
      }
      .card {
        max-width: 420px; width: 100%; text-align: center; padding: 36px 28px; border-radius: 24px;
        background: #ffffff0f; border: 1px solid #ffffff1f; backdrop-filter: blur(24px);
        box-shadow: inset 0 1px 0 #ffffff1a, 0 20px 50px -20px #000000a6;
      }
      .code {
        font-size: 72px; font-weight: 700; line-height: 1; letter-spacing: -2px;
        background: linear-gradient(90deg, #2f7bff, #22d3c5, #7a5cff); -webkit-background-clip: text; background-clip: text; color: transparent;
      }
      h1 { font-size: 20px; font-weight: 600; margin: 16px 0 8px; }
      p { margin: 0 0 24px; color: #9db4cc; font-size: 14px; line-height: 1.5; }
      p[lang="en"] { margin-top: -16px; }
      a {
        display: inline-flex; align-items: center; justify-content: center; height: 44px; padding: 0 22px; border-radius: 999px;
        color: #fff; text-decoration: none; font-weight: 500; font-size: 14px;
        background: linear-gradient(90deg, #2f7bff, #7a5cff);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="code">404</div>
      <h1>Страница не найдена</h1>
      <p>Такого адреса в Ореоле нет. Возможно, ссылка устарела или в ней опечатка.</p>
      <p lang="en">Page not found. The link may be outdated or mistyped.</p>
      <a href="/">Вернуться в Ореол · Back to Oreol</a>
    </main>
  </body>
</html>
