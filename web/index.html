<!doctype html>
<html lang="ru" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#040a14" />
    <title>Ореол</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-ring-32.png?v=4" />
    <link rel="icon" type="image/png" sizes="64x64" href="/assets/favicon-ring-64.png?v=4" />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg?v=4" />
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png?v=3" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- превью ссылки (карточка на домашней странице Safari, мессенджеры): текстовый логотип -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ореол" />
    <meta property="og:title" content="Ореол" />
    <meta property="og:description" content="Серверы, текстовые и голосовые каналы, личные сообщения и звонки" />
    <meta property="og:image" content="https://new.halomvp.ru/assets/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geologica:wght@400;500;600;700&family=Unbounded:wght@800&display=swap"
      rel="stylesheet"
    />
    <script>
      // Тема, прозрачность и живой фон — до первой отрисовки, иначе при перезагрузке на миг мелькал тор и тёмная тема.
      // По умолчанию: тема как в системе, стекло и живой фон выключены. Экран входа (нет токена) — тема системы, стекло и фон включены.
      try {
        var d = document.documentElement.dataset, ls = localStorage;
        var sys = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        var t = ls.getItem('oreol.theme'), auth = !!ls.getItem('oreol.token');
        d.theme = auth && (t === 'light' || t === 'dark') ? t : sys;
        d.glass = !auth || ls.getItem('oreol.glassUi') === '1' ? 'on' : 'off';
        d.backdrop = !auth || ls.getItem('oreol.liveBg') === '1' ? 'on' : 'off';
        d.glows = auth && ls.getItem('oreol.liveBg') === '1' && ls.getItem('oreol.bgGlows') === '1' ? 'on' : 'off';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
